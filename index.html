<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aleré Labs — Legal</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f5f6f8;
    --text: #14161a;
    --text-muted: #565c66;
    --border: #e2e4e9;
    --accent: #0a6b5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316;
      --bg-card: #1c1e22;
      --text: #eceef1;
      --text-muted: #a3a9b3;
      --border: #2c2f35;
      --accent: #4fd8bd;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    font-size: 16px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 16px 64px;
  }
  h1 {
    font-size: 26px;
    margin: 8px 0 4px;
  }
  .meta {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    margin-bottom: 12px;
  }
  a {
    display: block;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Aleré Labs — Legal</h1>
  <div class="meta">Effective date: 2026-09-25 · Version: 1.0</div>
  <ul>
    <li><a href="./privacy-policy.html">Privacy Policy</a></li>
    <li><a href="./consumer-health-data-privacy-policy.html">Consumer Health Data Privacy Policy</a></li>
  </ul>
</div>
</body>
</html>
